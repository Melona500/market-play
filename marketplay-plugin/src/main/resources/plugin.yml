name: MarketPlay
version: ${version}
main: kr.hyuni.marketplay.MarketPlayPlugin
api-version: '1.21'
depend: [FastAsyncWorldEdit, WorldGuard]
softdepend: [GSit, Citizens]
authors: [hyuni]
description: 시장놀이 생활경제 RPG 핵심 시스템
commands:
  marketplay:
    description: 시장놀이 상태와 시장 기능
    usage: /marketplay [market|sell|tools|board|reload|admin]
    aliases: [mp]
permissions:
  marketplay.admin:
    description: 시장놀이 관리 명령
    default: op
