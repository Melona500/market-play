name: MarketPlay
version: ${version}
main: kr.hyuni.marketplay.MarketPlayPlugin
api-version: '1.21'
depend: [FastAsyncWorldEdit, WorldGuard, Citizens]
softdepend: [GSit]
authors: [hyuni]
description: 시장놀이 생활경제 RPG 핵심 시스템
commands:
  marketplay:
    description: 시장놀이 상태와 시장 기능
    usage: /marketplay [market|sell|tools|board|home|mail|art|explore|craft|royal|knight|exchange|stall|guild|service|restaurant|endgame|dungeon|dragon|deeds|heaven|warrior|tower|reload|admin]
    aliases: [mp]
permissions:
  marketplay.admin:
    description: 시장놀이 관리 명령
    default: op
