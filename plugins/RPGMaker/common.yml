  초보_상점_이용법:
    example-version: 4
    built-in-example: true
    title: 왕도 잡화점 · 최종판
    speaker: '#FFAA00:bold:잡화점 주인'
    portrait: MALE_INNKEEPER
    expression: HAPPY
    camera-direction: NORTH
    message-pages:
    - |-
      #55FF55:왕도 잡화점에 어서 오세요!
      단골권을 만들면 특별한
      상품을 살 수 있습니다.
    - |-
      단골권과 에메랄드를 확인한 뒤
      #FFAA00:오늘의 상품을 골라 보세요.
      오늘의 행운은 {{shop_fortune}}점입니다.
    - |-
      구매가 끝났습니다.
      더 둘러보시겠습니까?
    page-portraits:
      '0': MALE_INNKEEPER
      '1': MALE_INNKEEPER
      '2': MALE_INNKEEPER
    page-expressions:
      '0': HAPPY
      '1': NEUTRAL
      '2': HAPPY
    page-effects:
      '0':
        variables-set: shop_fortune=random(1..100)
        sounds: minecraft:entity.villager.yes:1.0:0.7:1
        message: 왕도 잡화점 예제가 시작되었습니다.
        message-color: '#55FF55'
        return-mode: NONE
        command-target: PLAYER
      '1':
        message-color: '#FFFFFF'
        return-mode: NONE
        command-target: PLAYER
      '2':
        sounds: minecraft:block.note_block.bell:1.2:0.7:1
        message-color: '#FFFFFF'
        return-mode: NONE
        command-target: PLAYER
    page-conditions:
      '1':
        type: BOTH
        variable: shop_member
        operator: EQ
        value: 'yes'
        extra-variables: shop_visits=1,shop_last_purchase=elixir
        variable-logic: OR
        item-spec: '@OWNER/shop_coupon:1'
        replacement: |-
          #55FF55:단골 확인이 완료되었습니다.
          단골권으로 영약을 구매하거나
          상품 설명을 확인하세요.
    page-choices:
      '0':
        choice-count: 2
        choice-1: 단골 등록
        target-page-1: 0
        end-1: false
        response-pages-1:
        - |-
          등록됐습니다! 이 #55FF55:단골권으로
          특별 상품을 구매하세요.
        response-portrait-1:
          '0': MALE_INNKEEPER
        response-expression-1:
          '0': HAPPY
        response-show-portraits-1:
          '0': true
        response-show-speakers-1:
          '0': true
        response-effects-1:
          '0':
            items: '@OWNER/shop_coupon:1'
            variables-set: shop_member=yes, shop_visits=1, shop_hint=shown
            sounds: minecraft:entity.player.levelup:1.1:0.8:1
            message: 왕도 잡화점 단골권을 받았습니다.
            message-color: '#55FF55'
            return-mode: NONE
            command: tellraw {target} {"text":"[상점 예제] 단골 등록 완료!","color":"green"}
            command-target: PLAYER
        choice-2: 이용법 듣기
        target-page-2: 0
        end-2: false
        response-pages-2:
        - |-
          단골권은 특수 아이템입니다.
          조건이 맞을 때 구매 선택지가
          자동으로 나타납니다.
        response-show-portraits-2:
          '0': true
        response-show-speakers-2:
          '0': true
        response-effects-2:
          '0':
            message-color: '#FFFFFF'
            return-mode: NONE
            command-target: PLAYER
      '1':
        choice-count: 6
        choice-1: 회복 영약 구매
        target-page-1: 0
        end-1: false
        condition-1:
          type: BOTH
          variable: shop_member
          operator: EQ
          value: 'yes'
          extra-variables: shop_visits=1
          variable-logic: AND
          item-spec: '@OWNER/shop_coupon:1'
        response-pages-1:
        - |-
          단골권을 확인했습니다.
          #FF5555:붉은 회복 영약을
          안전하게 포장해 드릴게요.
        - 거래가 안전하게 완료됐습니다.
        response-portrait-1:
          '0': MALE_INNKEEPER
          '1': MALE_INNKEEPER
        response-expression-1:
          '0': NEUTRAL
          '1': HAPPY
        response-show-portraits-1:
          '0': true
          '1': true
        response-show-speakers-1:
          '0': true
          '1': true
        response-effects-1:
          '0':
            message-color: '#FFFFFF'
            return-mode: NONE
            command-target: PLAYER
          '1':
            items: '@OWNER/healing_elixir:1'
            take-items: '@OWNER/shop_coupon:1'
            variables-set: shop_last_purchase=elixir, shop_purchase_count=1
            variables-delete: shop_hint
            sounds: minecraft:entity.item.pickup:1.2:0.8:2
            message: 붉은 회복 영약 1병을 받았습니다.
            message-color: '#FF5555'
            return-mode: NONE
            command: tellraw {target} {"text":"[상점 예제] 구매 완료!","color":"yellow"}
            command-target: PLAYER
        choice-2: 상품 설명
        target-page-2: 0
        end-2: false
        response-pages-2:
        - 어떤 상품을 설명해 드릴까요?
        response-show-portraits-2:
          '0': true
        response-show-speakers-2:
          '0': true
        response-effects-2:
          '0':
            message-color: '#FFFFFF'
            return-mode: NONE
            command-target: PLAYER
        response-page-choices-2:
          '0':
            choice-count: 2
            choice-1: 붉은 영약
            target-page-1: 0
            end-1: false
            response-pages-1:
            - |-
              #FF5555:붉은 회복 영약은
              따뜻한 마력이 담긴
              잡화점의 특별 상품입니다.
            response-show-portraits-1:
              '0': true
            response-show-speakers-1:
              '0': true
            response-effects-1:
              '0':
                sounds: minecraft:block.brewing_stand.brew:1.0:0.7:1
                message-color: '#FFFFFF'
                return-mode: TARGET
                return-target: CHOICE:p1#c0
                command-target: PLAYER
            choice-2: 여행용 빵
            target-page-2: 0
            end-2: false
            response-pages-2:
            - |-
              #FFAA00:여행용 빵은 오래 보관되고
              모험 중 간편하게 먹기 좋습니다.
            response-show-portraits-2:
              '0': true
            response-show-speakers-2:
              '0': true
            response-effects-2:
              '0':
                sounds: minecraft:entity.item.pickup:1.0:0.6:1
                message-color: '#FFFFFF'
                return-mode: TARGET
                return-target: CHOICE:p1#c0
                command-target: PLAYER
        choice-3: 단골권 재발급
        target-page-3: 0
        end-3: false
        condition-3:
          type: VARIABLE
          variable: shop_member
          operator: EQ
          value: 'yes'
          variable-logic: AND
        response-pages-3:
        - 새 단골권을 한 장 드릴게요.
        response-show-portraits-3:
          '0': true
        response-show-speakers-3:
          '0': true
        response-effects-3:
          '0':
            items: '@OWNER/shop_coupon:1'
            sounds: minecraft:entity.villager.yes:1.1:0.7:1
            message: 단골권을 재발급했습니다.
            message-color: '#55FF55'
            return-mode: TARGET
            return-target: CHOICE:p1#c0
            command-target: PLAYER
        choice-4: 처음 안내로
        target-page-4: 0
        end-4: false
        response-pages-4:
        - 처음부터 다시 안내하겠습니다.
        response-show-portraits-4:
          '0': true
        response-show-speakers-4:
          '0': true
        response-effects-4:
          '0':
            message-color: '#FFFFFF'
            return-mode: TARGET
            return-target: PAGE:p0
            command-target: PLAYER
        choice-5: 상점 나가기
        target-page-5: 0
        end-5: true
        response-pages-5:
        - 다음 모험 전에 또 들러 주세요!
        response-show-portraits-5:
          '0': true
        response-show-speakers-5:
          '0': true
        response-effects-5:
          '0':
            message-color: '#FFFFFF'
            return-mode: NONE
            command-target: PLAYER
        choice-6: 여행용 빵 구매
        target-page-6: 0
        end-6: false
        condition-6:
          type: BOTH
          variable: shop_member
          operator: EQ
          value: 'yes'
          variable-logic: AND
          item-spec: minecraft:emerald:1
        response-pages-6:
        - |-
          에메랄드 1개를 확인했습니다.
          #FFAA00:여행용 빵 3개를
          따로 포장해 드릴게요.
        response-show-portraits-6:
          '0': true
        response-show-speakers-6:
          '0': true
        response-effects-6:
          '0':
            items: minecraft:bread:3:여행용 빵:#FFAA00
            take-items: minecraft:emerald:1
            variables-set: shop_last_purchase=bread
            sounds: minecraft:entity.item.pickup:1.0:0.7:1
            message: 여행용 빵 3개를 구매했습니다.
            message-color: '#FFAA00'
            return-mode: NONE
            command-target: PLAYER
      '2':
        choice-count: 2
        choice-1: 계속 쇼핑
        target-page-1: 0
        end-1: false
        response-pages-1:
        - 다시 상품 진열대로 안내할게요.
        response-show-portraits-1:
          '0': true
        response-show-speakers-1:
          '0': true
        response-effects-1:
          '0':
            message-color: '#FFFFFF'
            return-mode: TARGET
            return-target: CHOICE:p1#c0
            command-target: PLAYER
        choice-2: 거래 종료
        target-page-2: 0
        end-2: true
        response-pages-2:
        - 이용해 주셔서 감사합니다!
        response-show-portraits-2:
          '0': true
        response-show-speakers-2:
          '0': true
        response-effects-2:
          '0':
            message-color: '#FFFFFF'
            return-mode: NONE
            command-target: PLAYER
    page-speakers:
      '0': '#FFAA00:bold:잡화점 주인'
      '1': '#FFAA00:bold:잡화점 주인'
      '2': '#FFAA00:bold:잡화점 주인'
    page-show-portraits:
      '0': true
      '1': true
      '2': true
    page-show-speakers:
      '0': true
      '1': true
      '2': true
    page-flow:
      '0':
        next-page: 0
        terminal: false
        jump-target: 0
        jump-timing: AFTER
      '1':
        next-page: 0
        terminal: false
        jump-target: 0
        jump-timing: AFTER
      '2':
        next-page: 0
        terminal: false
        jump-target: 0
        jump-timing: AFTER
    public-owner: 00000000-0000-0000-0000-000000000000
    public-by: 00000000-0000-0000-0000-000000000000
  시장놀이_첫걸음:
    example-version: 1
    built-in-example: true
    title: 시장놀이 첫걸음
    speaker: '#FFD966:bold:광장 안내인'
    portrait: MALE_INNKEEPER
    expression: HAPPY
    camera-direction: NORTH
    message-pages:
    - |-
      #FFD966:시장놀이에 오신 것을 환영합니다!
      튜토리얼 구역에서 핵심 기능을
      하나씩 직접 연습하게 됩니다.
    - |-
      안내 표시를 따라 이동하고
      각 목표를 직접 완료하세요.
      목표마다 화면 안내가 한 번 뜹니다.
    - |-
      NPC 대화, GUI, 도구 사용,
      채집과 사냥을 순서대로 익힙니다.
      마지막에는 맵 이동도 연습합니다.
    page-expressions:
      '0': HAPPY
      '1': NEUTRAL
      '2': HAPPY
    public-owner: 00000000-0000-0000-0000-000000000000
    public-by: RPGMaker
  시장놀이_튜토리얼안내:
    title: 튜토리얼 안내
    speaker: '#FFD966:bold:튜토리얼 안내인'
    portrait: MALE_INNKEEPER
    expression: HAPPY
    message-pages:
    - |-
      안녕하세요! 이 연습 구역에서
      핵심 기능을 차례로 익힙니다.
    - |-
      대화 중 Space는 빠른 표시,
      Shift는 다음 문장과 종료입니다.
    - |-
      대화를 닫은 뒤 화면 안내를 따라
      Shift+손 바꾸기로 메뉴를 여세요.
    page-effects:
      '2':
        command: marketplay dialogue-tutorial
        command-target: PLAYER
    public-owner: 00000000-0000-0000-0000-000000000000
    public-by: RPGMaker
  시장놀이_시장안내:
    title: 생활도구 시장 안내
    speaker: '#55FF55:bold:생활도구 상인'
    portrait: MALE_VILLAGER
    message-pages:
    - |-
      솔은 고고학, 뜰채는 채집,
      괭이는 농사, 도끼는 벌목용입니다.
      가위와 곡괭이도 전용 작업에 씁니다.
    page-choices:
      '0':
        choice-count: 2
        choice-1: 도구와 판매 품목을 확인한다
        response-pages-1:
        - 도구와 판매 품목을 보여 드립니다.
        response-effects-1:
          '0':
            return-mode: NONE
            command: marketplay dialogue-menu market
            command-target: PLAYER
        end-1: true
        choice-2: 자원 등급과 판매법을 듣는다
        response-pages-2:
        - |-
          품질이 높을수록 값이 오릅니다.
          자원을 손에 들고 판매하세요.
        end-2: true
    public-owner: 00000000-0000-0000-0000-000000000000
    public-by: RPGMaker
  시장놀이_게시판안내:
    title: 시장 게시판 안내
    speaker: '#FFDD55:bold:게시판 관리인'
    portrait: FEMALE_VILLAGER
    message-pages:
    - |-
      자원 시세와 왕실 주문,
      주민 게시글을 함께 확인합니다.
      시세는 매일 달라집니다.
    page-choices:
      '0':
        choice-count: 2
        choice-1: 오늘의 시세와 주문을 확인한다
        response-pages-1:
        - 게시판 내용을 보여 드립니다.
        response-effects-1:
          '0':
            return-mode: NONE
            command: marketplay dialogue-menu board
            command-target: PLAYER
        end-1: true
        choice-2: 주민 글 작성법을 듣는다
        response-pages-2:
        - |-
          /mp board post 뒤에 글을 적어
          주민 게시글을 등록할 수 있습니다.
        end-2: true
    public-owner: 00000000-0000-0000-0000-000000000000
    public-by: RPGMaker
  시장놀이_주택안내:
    title: 주택 안내
    speaker: '#55FFAA:bold:주택 안내원'
    portrait: FEMALE_INNKEEPER
    message-pages:
    - |-
      내 집은 개인 월드로 분리됩니다.
      가구, 우편, 손님 초대가 가능합니다.
      재료를 모으면 집을 확장할 수 있습니다.
    page-choices:
      '0':
        choice-count: 2
        choice-1: 내 집과 우편을 확인한다
        response-pages-1:
        - 주택과 우편 메뉴를 보여 드립니다.
        response-effects-1:
          '0':
            return-mode: NONE
            command: marketplay dialogue-menu housing
            command-target: PLAYER
        end-1: true
        choice-2: 집 확장 조건을 듣는다
        response-pages-2:
        - |-
          주택 메뉴에서 현재 단계와
          필요한 확장 재료를 확인하세요.
        end-2: true
    public-owner: 00000000-0000-0000-0000-000000000000
    public-by: RPGMaker
  시장놀이_여행안내:
    title: 여행 안내
    speaker: '#55FFFF:bold:여행 안내원'
    portrait: MALE_VILLAGER
    message-pages:
    - |-
      채집소에는 숲, 들, 목장,
      광산과 강이 있습니다.
      탐험지는 계급에 따라 열립니다.
    page-choices:
      '0':
        choice-count: 2
        choice-1: 채집소와 탐험 길을 확인한다
        response-pages-1:
        - 맵 끝 이동 경로를 알려 드립니다.
        response-effects-1:
          '0':
            return-mode: NONE
            command: marketplay dialogue-menu travel
            command-target: PLAYER
        end-1: true
        choice-2: 계급별 탐험 순서를 듣는다
        response-pages-2:
        - |-
          평민은 조이광산부터 시작합니다.
          계급이 오르면 바다와 왕성이 열립니다.
        end-2: true
    public-owner: 00000000-0000-0000-0000-000000000000
    public-by: RPGMaker
  시장놀이_모험안내:
    title: 모험가 길드 안내
    speaker: '#FF5555:bold:모험가 길드 안내원'
    portrait: MALE_WARRIOR
    message-pages:
    - |-
      기사 시험은 전직 준비 과정입니다.
      던전과 무한 탑은 전투 콘텐츠입니다.
      후반 마을에서 용과 천국이 열립니다.
    page-choices:
      '0':
        choice-count: 2
        choice-1: 사냥과 도전 경로를 확인한다
        response-pages-1:
        - 맵 끝의 도전 경로를 알려 드립니다.
        response-effects-1:
          '0':
            return-mode: NONE
            command: marketplay dialogue-menu adventure
            command-target: PLAYER
        end-1: true
        choice-2: 후반 성장 순서를 듣는다
        response-pages-2:
        - |-
          기사 시험과 던전을 먼저 익힌 뒤
          무한 탑과 후반 마을에 도전하세요.
        end-2: true
    public-owner: 00000000-0000-0000-0000-000000000000
    public-by: RPGMaker
  시장놀이_시설안내:
    title: 시장놀이 시설 안내
    speaker: '#FFD966:bold:시설 안내인'
    portrait: FEMALE_VILLAGER
    message-pages:
